services:
  query.db:
      container_name: query.db
      image: postgres:17
      restart: always
      ports:
        - "5435:5432"
      environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_DB=query_service
      volumes:
        - postgres_query:/var/lib/postgresql/data/
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U postgres" ]
        interval: 10s
        timeout: 5s
        retries: 5

volumes:
  postgres_query: