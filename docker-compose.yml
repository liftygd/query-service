services:
  query.db:
      container_name: query.db
      image: postgres:17
      restart: always
      ports:
        - "5435:5432"
      environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_DB=query_service
      volumes:
        - postgres_query:/var/lib/postgresql/data/
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U postgres" ]
        interval: 10s
        timeout: 5s
        retries: 5

  query.api:
    image: query.api
    build: 
      context: ./
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Release
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Database=Server=query.db;Port=5432;Database=query_service;Username=postgres;Password=postgres
    depends_on:
        query.db:
          condition: service_healthy
    ports:
      - "5000:8080"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

volumes:
  postgres_query: